    .footprint-stage::before, .footprint-stage::after { content: ""; position: absolute; width: 205px; height: 1px; top: 50%; left: calc(50% - 102px); background: repeating-linear-gradient(90deg,rgba(99,130,225,.62) 0 2px,transparent 2px 5px); transform: rotate(24deg); }

      eye: '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>',
      eyeOff: '<svg viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a17.7 17.7 0 0 1-3.2 3.8M6.2 6.8C3.5 8.6 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"/></svg>',
      check: '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
      alert: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
      clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
      link: '<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.3l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.5-.3l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"/></svg>',
      copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      refresh: '<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-5L4 8M4 4v4h4M4 13a8 8 0 0 0 14 5l2-2m0 4v-4h-4"/></svg>',
      arrow: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
      close: '<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>',
      database: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg>',
      user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>',
      grid: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>',
      fingerprint: '<svg viewBox="0 0 24 24"><path d="M12 11a2 2 0 0 1 2 2c0 4-1 6-2 8M8 13c0-2.2 1.8-4 4-4s4 1.8 4 4c0 3.1-.6 5.4-1.3 7M4 13a8 8 0 0 1 16 0c0 3.2-.6 5.7-1.4 8M12 5a8 8 0 0 0-8 8"/></svg>',
      triangle: '<svg viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v4M12 17h.01"/></svg>',
      info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'
    };
    const navItems = [
      ['Dashboard','grid'], ['Digital Identity','fingerprint'], ['Security Analyzer','shield'],
      ['Phishing Detection','triangle'], ['Cyberbullying Detection','shield'], ['AI Security Report','database'], ['Profile / Settings','user']
    ];
    const serviceNames = ['Gmail','Instagram','LinkedIn','Facebook','Spotify','YouTube','Amazon'];
    const nodeClasses = ['node-gmail','node-instagram','node-linkedin','node-facebook','node-spotify','node-youtube','node-amazon'];
    const risks = [
      { service:'Instagram', status:'High Risk', description:'This email appeared in an Instagram-related breach. Exposed information: Email, Username.', source:'Known Breach Database', lastSeen:'2023', details:'Email, Username', steps:['Open Instagram → profile picture → menu (☰) → Accounts Center → Password and security.','Choose Change password and create a unique password with 12+ characters.','Open Two-factor authentication → Instagram and finish setup.','Open Where you’re logged in and sign out unknown devices.'] },
      { service:'Amazon', status:'High Risk', description:'This email appeared in an Amazon-related exposure. Exposed information: Email, Phone.', source:'Known Breach Database', lastSeen:'2022', details:'Email, Phone', steps:['Open Amazon → Account & Lists → Account → Login & security.','Select Edit beside Password and create a unique 12+ character password.','Open 2-step verification and follow the setup prompts.','Review Login & security and remove devices you do not recognize.'] },
      { service:'LinkedIn', status:'High Risk', description:'This email appeared in a LinkedIn-related exposure. Exposed information: Email, Profile data.', source:'Known Breach Database', lastSeen:'2021', details:'Email, Profile data', steps:['Open LinkedIn → Me → Settings & Privacy → Sign in & security.','Choose Change password and save a new unique password.','Open Two-step verification and connect an authenticator app or phone.','Review Where you’re signed in and sign out unfamiliar sessions.'] },
      { service:'Gmail', status:'High Risk', description:'This email has a Google account exposure. Review your password and recent account activity.', source:'Google Security Checkup', lastSeen:'2024', details:'Email, Recovery data', steps:['Open myaccount.google.com → Security → How you sign in to Google.','Choose Password and create a unique password with 12+ characters.','Open 2-Step Verification and complete the setup.','Check Your devices and remove any device you do not recognize.'] }
    ];
    
    // Initialize default state
    let defaultEmail = 'neeraja.shinde@cybershield.ai';
    if (window.CyberShieldState) {
      const csState = window.CyberShieldState.getState();
      if (csState.user && csState.user.email) {
        defaultEmail = csState.user.email;
      }
    }

    const state = { mode:'password', activeNav:'Security Analyzer', password:'Neeraja@2007', showPassword:false, score:42, email:defaultEmail, profile:null, scanned:false, fixed:false, modal:false, generated:'k7!Q9#fZq4sLm8@vT2#', notice:null };
    
    function esc(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function logo(name) { return '<span class="service-logo service-logo-' + name.toLowerCase() + '">' + ({Gmail:'G',Instagram:'◎',LinkedIn:'in',Facebook:'f',Spotify:'●',YouTube:'▶',Amazon:'a'}[name] || '?') + '</span>'; }
    function profileFor(address) {
      const normalized = address.trim().toLowerCase();
      if (normalized === 'neeraja@gmail.com' || normalized === 'neeraja.shinde@cybershield.ai') {
        const services = [
          ['Gmail','Verified','safe','2024','No exposure'],['Instagram','At Risk','risk','2023','Email, Username'],['LinkedIn','Need Review','warn','2021','Email'],
          ['Facebook','Verified','safe','2024','No exposure'],['Spotify','Verified','safe','2024','No exposure'],['YouTube','Need Review','warn','2022','Email'],['Amazon','High Risk','risk','2020','Email, Phone']
        ].map(([name,status,tone,lastSeen,details]) => ({name,status,tone,lastSeen,details}));
        return { email:address, serviceCount:7, lowRisk:3, review:2, highRisk:2, services, topRisk:risks[0] };
      }
      const seed = [...normalized].reduce((sum,c) => sum + c.charCodeAt(0), 0);
      const topRisk = risks[seed % risks.length];
      const riskIndex = serviceNames.indexOf(topRisk.service);
      const highRiskCount = seed % 3 === 0 ? 2 : 1;
      const reviewCount = seed % 2 === 0 ? 2 : 1;
      const reviewIndex = (riskIndex + 2 + seed % 3) % serviceNames.length;
      const services = serviceNames.map((name,index) => {
        const tone = index === riskIndex || (highRiskCount === 2 && index === (riskIndex + 4) % serviceNames.length) ? 'risk' : index === reviewIndex || (reviewCount === 2 && index === (reviewIndex + 3) % serviceNames.length) ? 'warn' : 'safe';
        const match = name === topRisk.service ? topRisk : null;
        return { name, tone, status:tone === 'risk' ? 'At Risk' : tone === 'warn' ? 'Need Review' : 'Verified', lastSeen:match?.lastSeen || (tone === 'warn' ? '2022' : '2024'), details:match?.details || (tone === 'warn' ? 'Email' : 'No exposure') };
      });
      return { email:address, serviceCount:7, lowRisk:services.filter(s=>s.tone==='safe').length, review:services.filter(s=>s.tone==='warn').length, highRisk:services.filter(s=>s.tone==='risk').length, services, topRisk };
    }
    
    state.profile = profileFor(state.email);
    
    function notice(title,message,tone='') { state.notice = {title,message,tone}; render(); clearTimeout(notice.timer); notice.timer = setTimeout(() => { state.notice = null; render(); }, 4200); }
    function serviceNodes(profile) { return profile.services.map((service,index) => '<div class="service-node '+service.tone+' '+nodeClasses[index]+'">'+logo(service.name)+'<div><strong>'+esc(service.name)+'</strong><small>'+esc(service.status)+'</small></div></div>').join(''); }
    
    function passwordView() {
      const tone = state.score >= 70 ? 'Strong' : state.score >= 45 ? 'Fair' : 'Weak';
      const color = state.score >= 70 ? '#2bd6a8' : state.score >= 45 ? '#f2c14d' : '#ee4e81';
      const reasons = state.score < 70 ? ['Contains your name (Neeraja)','Uses a common year (2007)','Simple structure (Name + Symbol + Year)','Common password pattern detected'] : ['Strong length and character variety detected'];
      return '<div class="password-view"><section class="panel"><div class="panel-header"><div class="panel-title"><div class="title-icon">'+icons.lock+'</div><div><h2>Password Security</h2><p class="panel-subtitle">Analyze your password, detect risks, and get personalized suggestions.</p></div></div><span class="ai-badge">'+icons.sparkle+' AI Powered</span></div><form class="input-row" onsubmit="event.preventDefault(); analyzePassword()"><div class="field-wrap"><input id="password-input" class="text-field" type="'+(state.showPassword?'text':'password')+'" value="'+esc(state.password)+'" oninput="state.password=this.value"></div><button type="button" class="icon-button field-action" onclick="state.showPassword=!state.showPassword;render()">'+(state.showPassword?icons.eyeOff:icons.eye)+'</button></div><button class="primary-button" type="submit"><span>'+icons.sparkle+' Analyze</span></button></form><div class="password-analysis"><div class="score-card"><div class="score-ring" style="background:conic-gradient('+color+' 0 '+state.score+'%,#273e73 '+state.score+'% 100%)"><div class="score-value"><strong>'+state.score+'</strong><small>/100</small></div></div><div class="score-detail"><h3 style="color:'+color+'">'+tone+'</h3><p>'+(state.score>=70?'Your password is harder to guess.':'Your password is easy to guess.')+'</p><div class="meter"><span style="width:'+state.score+'%;background:'+color+'"></span></div></div></div><div class="crack-card"><div class="crack-label">'+icons.clock+' Estimated Crack Time</div><div class="crack-time">'+(state.score>=70?'Several years':state.score>=45?'About 3 days':'Less than 1 hour')+'</div><div class="crack-note">'+(state.score>=70?'Strong combinations resist common cracking tools.':'This password can be cracked quickly with common tools.')+'</div></div></div><div class="risk-grid"><div class="risk-card"><h3>Why is it '+tone.toLowerCase()+'? <span>'+(state.score<70?'Pattern Detected':'Good Practice')+'</span></h3><ul class="risk-list">'+reasons.map(item=>'<li>'+icons.alert+' '+item+'</li>').join('')+'</ul></div><div class="risk-card"><h3>Quick Fix Suggestions</h3><ul class="risk-list fix-list"><li>'+icons.check+' Use 12+ characters</li><li>'+icons.check+' Avoid personal info</li><li>'+icons.check+' Add random words</li><li>'+icons.check+' Use a mix of characters</li></ul></div></div></section><section class="panel reuses-panel"><div class="subpanel-heading">'+icons.link+'<div><h3>Password Reuse Check</h3><p>Check if your password is used across multiple accounts.</p></div></div><div class="table-wrap"><table><thead><tr><th>Account</th><th>Status</th><th>Risk</th><th></th></tr></thead><tbody><tr><td><div class="account">'+logo('Gmail')+' Gmail</div></td><td><span class="status-pill danger">Reused</span></td><td style="color:#f06991">High Risk</td><td>'+icons.arrow+'</td></tr><tr><td><div class="account">'+logo('Instagram')+' Instagram</div></td><td><span class="status-pill danger">Reused</span></td><td style="color:#f06991">High Risk</td><td>'+icons.arrow+'</td></tr><tr><td><div class="account">'+logo('LinkedIn')+' College Portal</div></td><td><span class="status-pill safe">Unique</span></td><td style="color:#31d5ae">Safe</td><td>'+icons.arrow+'</td></tr><tr><td><div class="account">'+logo('LinkedIn')+' LinkedIn</div></td><td><span class="status-pill unknown">Unknown</span></td><td style="color:#8e9dbd">Not verified</td><td>'+icons.arrow+'</td></tr></tbody></table></div></section><section class="panel generate-panel"><div class="subpanel-heading">'+icons.sparkle+'<div><h3>Generate a Strong Password</h3><p>Create a secure password with one click.</p></div></div><div class="generate-row"><div class="generate-input">'+esc(state.generated)+'<button class="copy-button" onclick="copyValue(state.generated)">'+icons.copy+'</button></div><button class="primary-button generate-action" onclick="generatePassword()"><span>'+icons.refresh+' Generate New</span></button></div><div class="feature-list"><span>'+icons.check+' 20 characters</span><span>'+icons.check+' Uppercase + lowercase</span><span>'+icons.check+' Numbers + symbols</span></div></section></div>';
    }

    function emailView() {
      const p = state.profile, r = p.topRisk;
      const modal = state.modal ? '<div class="fix-modal-backdrop" onclick="state.modal=false;render()"><section class="fix-modal" onclick="event.stopPropagation()"><div class="fix-modal-heading"><div>'+icons.alert+'<div><strong>Fix your '+esc(r.service)+' risk</strong><p>Follow these steps from the '+esc(r.service)+' app or website.</p></div></div><button class="icon-button" onclick="state.modal=false;render()">'+icons.close+'</button></div><ol class="fix-steps">'+r.steps.map((step,i)=>'<li class="fix-step"><span class="fix-step-number">'+(i+1)+'</span><div><strong>'+(['Open '+r.service+' security','Change your password','Turn on two-factor authentication','Sign out unknown devices'][i])+'</strong><p>'+esc(step)+'</p></div></li>').join('')+'</ol><div class="fix-modal-note">'+icons.check+'<span>After completing the steps, click the button below to mark this risk as fixed.</span></div><button class="fix-button" onclick="markRiskFixed()">'+icons.check+' Fix '+esc(r.service)+' Risk</button></section></div>' : '';
      return '<div class="email-view"><section class="panel footprint-card"><div class="panel-header"><div class="panel-title"><div class="title-icon">'+icons.mail+'</div><div><h2>Email Security Footprint</h2><p class="panel-subtitle">Enter your email to check where it’s been used, exposed or linked.</p></div></div></div><form class="input-row" onsubmit="event.preventDefault();scanEmail()"><div class="field-wrap"><input id="email-input" class="text-field" type="email" value="'+esc(state.email)+'" oninput="state.email=this.value"></div><button class="primary-button" type="submit"><span>'+icons.search+' Scan Footprint</span></button></form>'+(state.scanned?'<div class="scan-status">'+icons.check+' Local scan refreshed for '+esc(state.email)+'</div>':'')+'<div class="footprint-stage"><div class="footprint-summary"><div class="summary-icon">'+icons.mail+'</div><div><strong>Your Digital Footprint</strong><span>'+p.serviceCount+' services detected for '+esc(p.email)+'</span></div></div><div class="footprint-donut"><div class="donut-content"><strong>'+p.serviceCount+'</strong><span>services</span></div></div><div class="footprint-legend"><span><i class="legend-dot dot-safe"></i> '+p.lowRisk+' Low Risk</span><span><i class="legend-dot dot-warn"></i> '+p.review+' Need Review</span><span><i class="legend-dot dot-risk"></i> '+p.highRisk+' High Risk</span></div><div class="hub">'+icons.mail+'<span>'+esc(p.email)+'</span></div>'+serviceNodes(p)+'</div><div class="risk-section"><div class="risk-section-title">'+icons.alert+' <strong>Top Risks &amp; Recommendations</strong></div><div class="risk-highlight '+(state.fixed?'resolved':'')+'"><div class="risk-service-avatar">'+logo(r.service)+'</div><div class="risk-text"><strong>'+esc(r.service)+' <span class="status-pill '+(state.fixed?'safe':'danger')+'">'+(state.fixed?'Fixed':esc(r.status))+'</span></strong><p>'+(state.fixed?esc(r.service+' security settings updated for '+p.email+'.'):esc(p.email+': '+r.description))+'</p></div>'+(state.fixed?'<div class="fixed-badge">'+icons.check+' Fixed</div>':'<button class="small-button" onclick="state.modal=true;render()">Take Action</button>')+'<div class="risk-meta"><span>Source: '+esc(r.source)+'</span><span>Last seen: '+r.lastSeen+'</span></div></div>'+modal+'<details class="breakdown" open><summary class="breakdown-summary">Detailed Breakdown '+icons.arrow+'</summary><table><thead><tr><th>Service</th><th>Exposure Status</th><th>Last Seen</th><th>Details</th></tr></thead><tbody>'+p.services.map(s=>'<tr><td><div class="breakdown-service">'+logo(s.name)+esc(s.name)+'</div></td><td><span class="status-pill '+(s.tone==='risk'?'danger':s.tone)+'">'+esc(s.status)+'</span></td><td>'+s.lastSeen+'</td><td>'+esc(s.details)+'</td></tr>').join('')+'</tbody></table></details><div class="subpanel-heading" style="padding:12px 0 0">'+icons.info+'<div><h3>How was this found?</h3><p>We check known breach databases, public records and verified data leaks to find where your email might be exposed.</p></div></div></div></section></div>';
    }

    function render() {
      document.getElementById('app').innerHTML = '<div class="app-shell"><aside class="sidebar"><div class="brand" onclick="selectNav(\'Dashboard\')">'+icons.shield+'<div><div class="brand-name">CyberShield AI</div><div class="brand-tagline">Think. Detect. Stay Safe.</div></div></div><div class="nav-label">Workspace</div><nav class="nav">'+navItems.map(([label,icon])=>'<button class="nav-item '+(state.activeNav===label?'active':'')+'" onclick="selectNav(\''+label.replace(/'/g,"\\'")+'\')">'+icons[icon]+'<span>'+label+'</span></button>').join('')+'</nav><div class="sidebar-spacer"></div><div class="sidebar-promo">'+icons.shield+'<strong>Stronger<br>Passwords. Safer You.</strong><span>Protected by CyberShield AI</span></div></aside><main class="main"><header class="topbar"><div class="top-actions"><button class="icon-button" onclick="notice(\'No new alerts\',\'Your CyberShield workspace is up to date.\')">'+icons.bell+'</button><button class="avatar" onclick="selectNav(\'Profile / Settings\')">NS</button></div></header><div class="page"><div class="page-heading"><button class="icon-button" onclick="selectNav(\'Dashboard\')">'+icons.arrow+'</button><div><h1>Security Analyzer</h1><p>'+(state.activeNav==='Security Analyzer'?'Check your password strength, detect risks and stay one step ahead.':state.activeNav+' is selected. Continue exploring the local security analyzer.')+'</p></div></div><div class="mode-switch"><button class="mode-button '+(state.mode==='password'?'active':'')+'" onclick="state.mode=\'password\';render()">'+icons.lock+' Password Security</button><button class="mode-button '+(state.mode==='email'?'active':'')+'" onclick="state.mode=\'email\';render()">'+icons.database+' Email Security Footprint</button></div>'+(state.mode==='password'?passwordView():emailView())+'</div></main>'+(state.notice?'<div class="notification '+state.notice.tone+'"><button class="icon-button" onclick="state.notice=null;render()">'+icons.close+'</button><strong>'+esc(state.notice.title)+'</strong><p>'+esc(state.notice.message)+'</p></div>':'')+'</div>';
    }

    function analyzePassword() {
      const value = state.password, lower = value.toLowerCase();
      const lengthScore = Math.min(value.length * 3, 48);
      const variety = [/[A-Z]/,/[a-z]/,/[0-9]/,/[^A-Za-z0-9]/].filter(r=>r.test(value)).length * 10;
      const penalty = (lower.includes('neerja') || lower.includes('neeraja')?16:0)+(lower.includes('2007')?15:0)+(/123|password|qwerty/i.test(value)?18:0);
      state.score = Math.max(8,Math.min(98,lengthScore+variety-penalty)); 
      
      if (window.CyberShieldState) {
        const tone = state.score >= 70 ? 'Strong' : state.score >= 45 ? 'Fair' : 'Weak';
        window.CyberShieldState.recordPasswordScan({
          scoreNum: state.score,
          label: tone,
          crackTime: (state.score>=70?'Several years':state.score>=45?'About 3 days':'Less than 1 hour')
        });
      }

      render();
      notice(state.score>=70?'Password analysis complete':'Risk pattern detected',state.score>=70?'This password has a healthy mix of length and character variety.':'CyberShield found predictable patterns. Review the quick fixes below.',state.score>=70?'success':'error');
    }

    function scanEmail() {
      if (!state.email.trim() || !state.email.includes('@')) { notice('Email needed','Enter a valid email address before scanning.','error'); return; }
      state.profile = profileFor(state.email); state.scanned = true; state.fixed = false; render();
      notice('Footprint scan complete',state.profile.serviceCount+' services and '+state.profile.highRisk+' high-risk result'+(state.profile.highRisk===1?'':'s')+' mapped for '+state.email,'success');
    }

    function generatePassword() {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%';
      state.generated = Array.from({length:20},(_,i)=>chars[(i*17+Date.now()+i*13)%chars.length]).join('');
      render(); notice('New password generated','Your password was created locally and was not sent anywhere.','success');
    }

    function copyValue(value) { navigator.clipboard?.writeText(value).then(()=>notice('Copied','Copied to your clipboard for this demo session.','success')).catch(()=>notice('Copy unavailable','Select the text manually.','error')); }

    function markRiskFixed() {
      state.fixed = true;
      state.modal = false;
      if (window.CyberShieldState) {
        window.CyberShieldState.resolveIssue('weakpass');
        window.CyberShieldState.resolveIssue('outlook');
      }
      render();
      notice('Risk fixed', 'Risk status marked as fixed and synced with CyberShield AI report.', 'success');
    }

    function selectNav(label) {
      const pageMap = {
        'Dashboard': 'dashboard.html',
        'Digital Identity': 'digital-identity.html',
        'Security Analyzer': 'security-analyzer.html',
        'Phishing Detection': 'phishing-detection.html',
        'Cyberbullying Detection': 'cyberbullying-detection.html',
        'AI Security Report': 'security-report.html',
        'Profile / Settings': 'settings.html'
      };

      if (pageMap[label] && label !== 'Security Analyzer') {
        window.location.href = pageMap[label];
      } else {
        state.activeNav = label;
        render();
        if (label !== 'Security Analyzer') {
          notice(label + ' selected', 'Navigating to ' + label);
        }
      }
    }

    render();
  </script>
</body>
</html>
